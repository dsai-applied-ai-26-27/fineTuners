    q: |-
      Classification ML Tasks (−0.2 per incorrect answer)
    solution: |-
      **If it is the matching exercise**, the six categories and their discriminators:

      Classification → predict a category · Regression → predict a number · Clustering → group without labels · Association rules → items that co-occur · Anomaly detection → rare/suspicious cases · Summarization → compress into a description.

      The lecture's own set: spam or not spam → classification · estimate selling price → regression · discover similar buying profiles → clustering · bread and milk bought together → association rules · unusual transactions → anomaly detection · concise trends dashboard → summarization.

      **If it is multiple-choice on classification concepts**, the exam-prep document's own worked example is the model: "*Which statement is correct?* A. Accuracy is always the best metric. B. K-Means automatically determines the optimal number of clusters. C. **Scaling is important for distance-based methods such as K-Means.** D. PCA components are always easier to interpret." — **C is correct**, because K-Means is based on distances and variables on larger scales dominate the result.

      **Strategy:** with −0.2 per wrong answer, guessing on a 4-option item has negative expected value. Eliminate to one or leave it blank.
    source: |-
