title: Dynamic programming
topic: dp
description: The two properties, states, transitions and base cases, memoization against tabulation, and the recurrences of climbing stairs, coin change, LIS and 0/1 knapsack.

cards:
  - id: dp-what
    q: |-
      What is dynamic programming?
    a: |-
      A paradigm that solves a problem from subproblems and stores each subproblem's answer so it
      is never recomputed, trading memory for time.

  - id: dp-properties
    hy: true
    q: |-
      The two properties a problem needs for DP.
    a: |-
      Overlapping subproblems (the same subproblems recur) and optimal substructure (an optimal
      solution is built from optimal solutions of subproblems).

  - id: dp-stairs
    hy: true
    q: |-
      Climbing stairs with 1- or 2-steps: recurrence and base cases.
    a: |-
      $\text{ways}(n) = \text{ways}(n-1) + \text{ways}(n-2)$, $\text{ways}(0) = \text{ways}(1) = 1$:
      the Fibonacci recurrence.

  - id: dp-naive
    q: |-
      Why is naive recursion on climbing stairs exponential?
    a: |-
      Each call branches in two and the same values are recomputed in many branches: the
      recursion tree has many identical subtrees.

  - id: dp-top-bottom
    hy: true
    q: |-
      Top-down against bottom-up DP.
    a: |-
      Top-down (memoization): recursion that stores and reuses results. Bottom-up (tabulation):
      fill a table from the base cases upwards; easier to analyse, no recursion stack.

  - id: dp-recipe
    hy: true
    cloze: |-
      Every DP: define the {{state}}, the {{transitions}}, the {{base cases}}, and the
      {{evaluation order}}.

  - id: dp-state
    q: |-
      What is a DP state?
    a: |-
      The minimal information that describes a subproblem completely, enough to decide the next
      transitions without the history.

  - id: dp-coin
    hy: true
    q: |-
      Coin change (count the ways): state, transition, base cases.
    a: |-
      $dp[i][j]$ = ways to form $j$ with the first $i$ coins;
      $dp[i][j] = dp[i-1][j] + dp[i][j - c_i]$; $dp[i][0] = 1$, $dp[0][j > 0] = 0$.
    note: |-
      The second term stays in row $i$ because a coin may be reused.

  - id: dp-coin-example
    q: |-
      How many ways make 5 from coins 1, 2, 3?
    a: |-
      5: 1+1+1+1+1, 2+1+1+1, 2+2+1, 3+1+1, 3+2.

  - id: dp-lis
    hy: true
    q: |-
      LIS: state, transition, answer, complexity.
    a: |-
      $dp[i]$ = length of the LIS ending at $i$, $dp[i] = 1$ initially;
      $dp[i] = \max(dp[j] + 1)$ over $j < i$ with $a[j] < a[i]$; answer $\max_i dp[i]$; $O(n^2)$.

  - id: dp-lis-example
    q: |-
      LIS of [3, 10, 2, 1, 20]?
    a: |-
      $dp = [1, 2, 1, 1, 3]$, so 3: (3, 10, 20).

  - id: dp-knapsack
    hy: true
    q: |-
      0/1 knapsack: state and transition.
    a: |-
      $dp[i][w]$ = best value with the first $i$ items and capacity $w$;
      $dp[i][w] = \max(dp[i-1][w],\ dp[i-1][w - w_i] + v_i)$ when $w \ge w_i$; base cases 0.

  - id: dp-knapsack-example
    q: |-
      W = 5, values [1, 2, 3], weights [4, 5, 1]. Best value?
    a: |-
      4: items 1 and 3 (weight 5).

  - id: dp-families
    q: |-
      Typical families of DP problems?
    a: |-
      Counting, sequences, grids, subsets and knapsack.
