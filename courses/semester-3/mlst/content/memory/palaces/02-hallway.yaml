# Ids are permanent: people's progress is keyed by them.
title: 'Room 2 · Hallway: Preprocessing pipeline'
topic: preprocessing
encodes: |-
  The coat-check where raw data is cleaned, scaled and encoded before it is allowed into the rest of the flat. 6 stops, one exam-ready code pattern or idea at each.
intro: |-
  Room 2 of 12 on the walk from the front door to the roof: your own hallway, or whatever you substituted for it. Put each scene on the object itself, in this order: the coat rack, the hallway mirror, the umbrella stand, the two-lane corridor, the one-way door, the key cabinet. The method is in [](guide:memory-palace).

loci:
  - id: s2-1
    place: 'The coat rack'
    image: |-
      **The hook that fills every empty sleeve.** Coats hang on the rack, and some have **missing sleeves**. A brass hook swings around and staples on a replacement sleeve of exactly **middle length** — never the average, always the middle one, so a single freakishly long sleeve cannot skew it.
    means: |-
      **Imputing missing values.** Imputation only works on numbers, which is exactly why the numerical and categorical columns get separate branches downstream.

      ```python
      from sklearn.impute import SimpleImputer
      imputer = SimpleImputer(strategy="median")
      ```

      - `strategy="median"` (dial): Median over mean because it is robust to outliers and skew. Options: mean, median, most_frequent, constant.
    refs: ["guide:02-preprocessing"]

  - id: s2-2
    place: 'The hallway mirror'
    image: |-
      **The mirror that makes everyone the same height.** You pass the hall mirror and your reflection is squashed to **exactly average height, exactly one unit of wobble**. So is everyone else's. Income and age walk past as identical silhouettes.
    means: |-
      **Standardising features.** Subtract mean, divide by std → zero mean, unit variance. **Essential** for anything distance-based or gradient-based: k-NN, SVM, PCA, gradient descent, neural nets. **Irrelevant** for decision trees and random forests, which only compare thresholds within a feature.

      ```python
      from sklearn.preprocessing import StandardScaler
      scaler = StandardScaler()
      X_train_scaled = scaler.fit_transform(X_train)   # learn mean/std AND transform
      X_test_scaled  = scaler.transform(X_test)        # reuse the learned mean/std
      ```
    refs: ["guide:02-preprocessing"]

  - id: s2-3
    place: 'The umbrella stand'
    image: |-
      **One slot per umbrella colour.** The umbrella stand has a separate slot for every colour, and each umbrella drops a single **1** into its own slot and **0** into all the others. A stand with three colours needs three slots — unless you are being clever, in which case two slots tell you the third by elimination.
    means: |-
      **One-hot and dummy encoding.** One-hot creates **k dummy columns** for k categories. **Dummy encoding** creates k−1 and treats the omitted one as the reference, removing the redundancy (the k columns always sum to 1, so one is linearly dependent on the others).

      ```python
      from sklearn.preprocessing import OneHotEncoder
      cat_encoder = OneHotEncoder()
      ```
    refs: ["guide:02-preprocessing"]

  - id: s2-4
    place: 'The two-lane corridor'
    image: |-
      **The corridor that splits into a numbers lane and a categories lane.** Halfway down, the hallway forks. Everything numerical is sent left, through the **hook** then the **mirror**; everything categorical goes right, straight into the **umbrella stand**. At the far end the two lanes merge back into one wide doorway, and what comes out is `X_prepared`.
    means: |-
      **Pipeline and ColumnTransformer.** **Pipeline** chains steps *vertically* on the same columns — output of one feeds the next, and every step but the last must be a transformer. **ColumnTransformer** works *horizontally* — different transformers on different column subsets, results concatenated side by side. Both expose fit/transform, so a pipeline can sit inside a ColumnTransformer and vice versa.

      ```python
      from sklearn.pipeline import Pipeline
      from sklearn.compose import ColumnTransformer
      from sklearn.impute import SimpleImputer
      from sklearn.preprocessing import StandardScaler, OneHotEncoder

      num_pipeline = Pipeline([
          ("imputer", SimpleImputer(strategy="median")),
          ("std_scaler", StandardScaler()),
      ])

      full_pipeline = ColumnTransformer([
          ("num", num_pipeline, num_attribs),
          ("cat", OneHotEncoder(), cat_attribs),
      ])

      X_prepared = full_pipeline.fit_transform(X)
      ```

      - `("name", transformer, columns)` (structural): Every ColumnTransformer entry is a 3-tuple; every Pipeline step is a 2-tuple. The names are yours and only matter for grid search ("num__imputer__strategy").
    refs: ["guide:02-preprocessing"]

  - id: s2-5
    place: 'The one-way door'
    image: |-
      **The door that only learns once.** There is a one-way door at the end of the hall. The **first** person through it teaches the door their measurements, and it locks them in forever. Everyone after is measured against *them*. If you let a test-set person teach the door, you have cheated and the door will lie to you.
    means: |-
      **fit, transform and data leakage.** **fit** learns parameters (means, stds, categories, components). **transform** applies them. Calling `fit` or `fit_transform` on the test set is **data leakage** — the test estimate becomes optimistic. Models use `fit` / `predict`; transformers use `fit` / `transform`. That is the entire sklearn API.

      ```python
      scaler.fit_transform(X_train)   # LEARN the statistics, then apply them
      scaler.transform(X_test)        # APPLY the already-learned statistics

      # same convention for anything with parameters
      pca = PCA(n_components=0.95)
      X_train_reduced = pca.fit_transform(X_train)
      X_test_reduced  = pca.transform(X_test)
      ```
    refs: ["guide:02-preprocessing"]

  - id: s2-6
    place: 'The key cabinet'
    image: |-
      **The cabinet that tries every key in the building.** By the door hangs a cabinet with hundreds of keys. A mechanical arm takes each one, tries it in **three** different locks, writes down the score, and at the end hands you the single best key, engraved `best_params_`.
    means: |-
      **Grid search.** Grid search is exhaustive; `RandomizedSearchCV` samples instead, which is better when the grid is large. After fitting, `best_params_` holds the winning dict, `best_estimator_` the model already refitted on the whole training set.

      ```python
      from sklearn.model_selection import GridSearchCV
      from sklearn.tree import DecisionTreeClassifier

      param_grid = {"max_leaf_nodes": list(range(2, 100)),
                    "min_samples_split": [2, 3, 4]}

      grid_search = GridSearchCV(DecisionTreeClassifier(random_state=42),
                                 param_grid, cv=3)
      grid_search.fit(X_train, y_train)

      print(grid_search.best_params_)
      best = grid_search.best_estimator_
      ```

      - `param_grid = {...}` (structural): A dict of parameter name → list of values. Every combination is tried, so cost is the product of the list lengths times cv.
      - `cv=3` (dial): Folds of cross-validation per candidate. More folds = more reliable, linearly more expensive.
    refs: ["guide:02-preprocessing"]
