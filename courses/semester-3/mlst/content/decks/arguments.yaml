# Ids are permanent: people's progress is keyed by them.
title: 'Arguments that cost marks'
topic: sequences
description: 'Short cards, one argument each: the single keyword a marker looks for.'

cards:
  - id: arg-01
    topic: ensembles
    q: |-
      Soft voting with an `SVC` in the ensemble — what must you add, and why?
    a: |-
      ```python
      svm_clf = SVC(probability=True, random_state=42)
      ```
    note: |-
      Soft voting averages predict_proba, and SVC does not expose one by default. Without probability=True the fit fails.

      **In plain words.** SVC decides which side of a line you're on; it doesn't naturally produce a probability. This setting makes it fit an extra little calibration model that converts its scores into probabilities — which soft voting needs in order to average anything.

      ```text
      Without it: AttributeError, no predict_proba.
      With it: training is noticeably slower. Worth knowing
      both facts if they ask you to justify it.
      ```

  - id: arg-02
    topic: linear
    q: |-
      `PolynomialFeatures` inside a pipeline with StandardScaler and LinearRegression — which argument, and why?
    a: |-
      ```python
      PolynomialFeatures(degree=2, include_bias=False)
      ```
    note: |-
      LinearRegression already fits an intercept, and the constant column of 1s has zero variance for StandardScaler to divide by.

      **In plain words.** PolynomialFeatures would otherwise add a column of all 1s. LinearRegression already fits its own intercept, so it's redundant — and StandardScaler would try to divide that column by its standard deviation, which is zero.

      ```text
      x = 3, include_bias=True   →  [1, 3, 9]
      x = 3, include_bias=False  →  [3, 9]
      ```

  - id: arg-03
    topic: regularization
    q: |-
      A manual epoch loop around `SGDRegressor` — which three arguments make the loop actually work?
    a: |-
      ```python
      SGDRegressor(max_iter=1,          # one epoch per .fit() call
                   warm_start=True,     # continue, do not reset theta
                   tol=-np.infty,       # never stop on its own
                   penalty=None, learning_rate="constant", eta0=0.0005)
      ```
    note: |-
      Without max_iter=1 one fit runs 1000 epochs. Without warm_start each iteration restarts from random. Without tol=-np.infty sklearn stops before your loop does.

      **In plain words.** You are **taking the epoch loop away from sklearn** and running it yourself. So you tell it: run exactly one epoch per call, don't reset what you learned between calls, and never decide to stop on your own.

      ```text
      Miss max_iter=1   → one fit runs 1000 epochs at once
      Miss warm_start   → every iteration starts from random
      Miss tol=-inf     → sklearn quits before your loop does
      ```

  - id: arg-04
    topic: regularization
    q: |-
      Inside that loop, how do you keep the best model — and what is the difference from `clone`?
    a: |-
      ```python
      from copy import deepcopy
      best_model = deepcopy(sgd_reg)   # full snapshot, by value

      from sklearn.base import clone
      fresh = clone(sgd_reg)           # UNTRAINED copy, same hyperparameters
      ```
    note: |-
      deepcopy freezes a trained model. clone strips the training — that is the one you want inside a cross-validation fold.

      **In plain words.** **deepcopy takes a photograph of a trained model. clone takes the recipe without the training.** Keeping a best-model-so-far needs the photograph; getting a fresh model for each CV fold needs the recipe.

      ```text
      best_model = sgd_reg          ✗ just a reference —
                                       it keeps training
      best_model = deepcopy(sgd_reg)  ✓ frozen snapshot
      ```

  - id: arg-05
    q: |-
      Stacked recurrent layers — which argument, on which layers?
    a: |-
      ```python
      keras.layers.GRU(20, return_sequences=True, input_shape=[None, 1]),
      keras.layers.GRU(20, return_sequences=True),
      keras.layers.TimeDistributed(keras.layers.Dense(10))
      ```
    note: |-
      return_sequences=True on every recurrent layer that feeds another one, and on the last one too if the output must be a sequence. Only the first layer takes input_shape.

      **In plain words.** A recurrent layer can either report at **every** step or only at the **end**. The next recurrent layer needs a report at every step to have anything to read — so every layer that feeds another one needs True.

      ```text
      GRU(20, return_sequences=True)   → shape [batch, 50, 20]
      GRU(20)                          → shape [batch, 20]
      ```

  - id: arg-06
    topic: nlp
    q: |-
      Sequence in, **one** value out (sentiment) — what changes?
    a: |-
      ```python
      keras.layers.GRU(128, return_sequences=True),
      keras.layers.GRU(128),                       # no return_sequences
      keras.layers.Dense(1, activation="sigmoid")
      ```
    note: |-
      Dropping return_sequences on the LAST recurrent layer collapses the sequence into one vector. Then a plain Dense, not TimeDistributed.

      **In plain words.** Dropping `return_sequences` on the **final** recurrent layer is what collapses a sequence into a single summary vector — which is what you want when the answer is one thing about the whole input, like the sentiment of a review.

      ```text
      Sequence out (forecast 10 steps at every point):
         ... GRU(return_sequences=True), TimeDistributed(Dense)

      One value out (positive or negative review):
         ... GRU(),                      Dense(1, 'sigmoid')
      ```

  - id: arg-07
    q: |-
      A convolution used for **forecasting** — which padding, and why?
    a: |-
      ```python
      keras.layers.Conv1D(filters=20, kernel_size=2, padding="causal",
                          activation="relu", dilation_rate=rate)
      ```
    note: |-
      causal pads only on the left, so the output at time t depends only on inputs up to t. "same" would pad on the right and let the model see the future.

      **In plain words.** Ordinary padding adds values to **both** ends, which means the output at step t partly depends on step t+1. If you're predicting the future, that is cheating — the model will look brilliant in training and be useless in reality.

      ```text
      same   : [_ x x x x _]  ← pads the right, sees ahead
      causal : [_ _ x x x x]  ← pads only the left
      ```

  - id: arg-08
    q: |-
      `Conv1D(..., strides=2)` in front of the RNN — what must you change about the targets?
    a: |-
      ```python
      history = model.fit(X_train, Y_train[:, 3::2], epochs=20,
                          validation_data=(X_valid, Y_valid[:, 3::2]))
      ```
    note: |-
      Stride 2 halves the output length, so the targets must be downsampled to match. Step 2 = the stride; start 3 = the steps lost to valid padding.

      **In plain words.** The convolution jumps two steps at a time, so it emits half as many outputs. The list of correct answers has to be thinned out the same way, or Keras throws a shape mismatch.

      ```text
      Y_train[:, 3::2]

         start = 3   the steps lost to valid padding
         step  = 2   matches strides=2
      ```

  - id: arg-09
    topic: dimred
    q: |-
      PCA keeping 95% of the variance — write both forms and say what the argument means.
    a: |-
      ```python
      pca = PCA(n_components=0.95)      # FLOAT < 1 = keep this share of variance

      # the manual equivalent
      pca = PCA()
      pca.fit(X_train)
      cumsum = np.cumsum(pca.explained_variance_ratio_)
      d = np.argmax(cumsum >= 0.95) + 1
      pca = PCA(n_components=d)        # INT = this many dimensions
      ```
    note: |-
      Same argument, two meanings: float = variance ratio, int = dimensionality. A favourite trap.

      **In plain words.** Same argument, two completely different meanings. A **whole number** means "give me this many columns". A **decimal below 1** means "give me however many columns it takes to keep this much of the information".

      ```text
      PCA(n_components=154)   →  exactly 154 dimensions
      PCA(n_components=0.95)  →  as many as needed for 95%
      ```

  - id: arg-10
    topic: ensembles
    q: |-
      Bagging vs pasting, and free evaluation — which arguments?
    a: |-
      ```python
      BaggingClassifier(DecisionTreeClassifier(), n_estimators=500,
                        max_samples=100,
                        bootstrap=True,      # True = bagging, False = pasting
                        oob_score=True,      # only valid with bootstrap=True
                        random_state=42)
      ```
    note: |-
      One boolean is the entire difference between bagging and pasting. ~63.2% of instances are drawn, so ~37% are out-of-bag.

      **In plain words.** **With replacement (True)** means the same row can be drawn twice into one sample — that's bagging. **Without (False)** is pasting. Because of replacement, some rows never get picked at all, and those make a free test set.

      ```text
      Sample of 100 drawn with replacement from 100 rows:
      ~63 distinct rows appear, ~37 never do.
      Those 37 are the out-of-bag set.
      ```

  - id: arg-11
    topic: nlp
    q: |-
      Encoder → decoder handoff — which two arguments, and how many values does the encoder return?
    a: |-
      ```python
      encoder = keras.layers.LSTM(128, return_state=True)
      encoder_outputs, state_h, state_c = encoder(encoder_embeddings)

      decoder_outputs = keras.layers.LSTM(128, return_sequences=True)(
          decoder_embeddings, initial_state=[state_h, state_c])
      ```
    note: |-
      return_state=True gives THREE values for an LSTM (output, h, c) and TWO for a GRU. initial_state= is the handoff.

      **In plain words.** The encoder's final memory is its **summary of the whole input**. `return_state=True` hands that summary to you, and `initial_state=` plants it into the decoder as its starting memory. Those two arguments are the entire link between the halves.

      ```text
      LSTM: outputs, state_h, state_c = layer(x)   3 values
      GRU:  outputs, state = layer(x)               2 values
      ```

  - id: arg-12
    q: |-
      Choosing the Keras loss — write the three cases.
    a: |-
      ```python
      # regression / forecasting
      loss="mse"                                # Dense(n), no activation

      # binary classification
      loss="binary_crossentropy"                # Dense(1, activation="sigmoid")

      # multi-class, integer labels
      loss="sparse_categorical_crossentropy"    # Dense(n, activation="softmax")
      # multi-class, one-hot labels
      loss="categorical_crossentropy"
      ```
    note: |-
      Output units, output activation and loss are one decision, not three. Fix the task and all three follow. 'sparse' only when the labels are integer IDs.

      **In plain words.** The loss is **not a choice** — it follows from the question. Predicting a number → mse. Yes or no → binary_crossentropy with one sigmoid unit. One of many classes → softmax, with "sparse" in the loss name only if the labels are plain integers rather than one-hot vectors.

      ```text
      y = 3.7           → Dense(1)              + mse
      y = 0 or 1        → Dense(1, 'sigmoid')   + binary_crossentropy
      y = 7  (of 0..9)  → Dense(10,'softmax')   + sparse_categorical_crossentropy
      y = [0,0,..1,..0] → Dense(10,'softmax')   + categorical_crossentropy
      ```
