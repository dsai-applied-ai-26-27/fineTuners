  - id: s2-2a
    title: 'Question 2 (a)'
    topic: nlp
    q: |-
      Implement an encoder–decoder for sequence-to-sequence: encoder LSTM(128) returning state, decoder LSTM(128) initialised with the encoder states, Dense softmax output.
    solution: |-
      ```python
      encoder_inputs = keras.layers.Input(shape=[None], dtype=np.int32)
      decoder_inputs = keras.layers.Input(shape=[None], dtype=np.int32)

      embeddings = keras.layers.Embedding(vocab_size, embed_size)
      encoder_embeddings = embeddings(encoder_inputs)
      decoder_embeddings = embeddings(decoder_inputs)

      encoder = keras.layers.LSTM(128, return_state=True)
      encoder_outputs, state_h, state_c = encoder(encoder_embeddings)
      encoder_state = [state_h, state_c]

      decoder_lstm = keras.layers.LSTM(128, return_sequences=True)
      decoder_outputs = decoder_lstm(decoder_embeddings,
                                     initial_state=encoder_state)

      Y_proba = keras.layers.Dense(vocab_size, activation="softmax")(decoder_outputs)

      model = keras.models.Model(inputs=[encoder_inputs, decoder_inputs],
                                 outputs=[Y_proba])
      ```

      return_state=True on an LSTM unpacks into THREE variables. The decoder must have return_sequences=True (it emits a word at every step) and initial_state=encoder_state — that argument IS the encoder–decoder link. Functional API, because the graph has two inputs.
    source: |-
      Labelled "Sample paper 2 · 2a" in the study kit. The wording is the kit's summary of a colleague's practice exam, not the original.

  - id: s2-2b
    title: 'Question 2 (b)'
    topic: ensembles
    q: |-
      Gradient Boosting with early stopping: max_depth=2, n_estimators=120, random_state=42; use staged_predict on the validation set to find the number of estimators with the lowest MSE.
    solution: |-
      ```python
      from sklearn.ensemble import GradientBoostingRegressor
      from sklearn.metrics import mean_squared_error

      gbrt = GradientBoostingRegressor(max_depth=2, n_estimators=120, random_state=42)
      gbrt.fit(X_train, y_train)

      errors = [mean_squared_error(y_val, y_pred)
                for y_pred in gbrt.staged_predict(X_val)]
      bst_n_estimators = np.argmin(errors) + 1

      gbrt_best = GradientBoostingRegressor(max_depth=2,
                                            n_estimators=bst_n_estimators,
                                            random_state=42)
      gbrt_best.fit(X_train, y_train)
      ```

      +1 because errors[0] is the ensemble with ONE tree. The alternative implementation grows incrementally with warm_start=True and breaks after five consecutive increases in validation error.
    source: |-
