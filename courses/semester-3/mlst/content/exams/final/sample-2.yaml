  - id: s2-1a
    title: 'Question 1 (a)'
    topic: regularization
    q: |-
      Train Ridge with alpha=1 using the cholesky solver, Lasso with alpha=0.1, and ElasticNet with alpha=0.1 and l1_ratio=0.5.
    solution: |-
      ```python
      from sklearn.linear_model import Ridge, Lasso, ElasticNet

      ridge_reg = Ridge(alpha=1, solver="cholesky", random_state=42)
      ridge_reg.fit(X_train, y_train)

      lasso_reg = Lasso(alpha=0.1)
      lasso_reg.fit(X_train, y_train)

      elastic_net = ElasticNet(alpha=0.1, l1_ratio=0.5, random_state=42)
      elastic_net.fit(X_train, y_train)
      ```

      alpha is strength in all three; l1_ratio is the MIX and exists only in ElasticNet. Ridge shrinks all coefficients, Lasso zeroes some out entirely.
