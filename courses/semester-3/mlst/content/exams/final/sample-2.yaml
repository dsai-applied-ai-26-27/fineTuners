  - id: s2-2c
    title: 'Question 2 (c)'
    topic: sequences
    q: |-
      Create a WaveNet-style architecture: an input layer, a loop of Conv1D layers with dilation_rate doubling 1,2,4,8, causal padding, relu activation, ending with Conv1D of 10 filters and kernel size 1.
    solution: |-
      ```python
      model = keras.models.Sequential()
      model.add(keras.layers.InputLayer(input_shape=[None, 1]))

      for rate in (1, 2, 4, 8) * 2:
          model.add(keras.layers.Conv1D(filters=20, kernel_size=2,
                                        padding="causal", activation="relu",
                                        dilation_rate=rate))

      model.add(keras.layers.Conv1D(filters=10, kernel_size=1))
      model.compile(loss="mse", optimizer="adam", metrics=[last_time_step_mse])
      history = model.fit(X_train, Y_train, epochs=20,
                          validation_data=(X_valid, Y_valid))
      ```

      causal padding = no peeking at future time steps. Doubling dilation grows the receptive field exponentially. The final kernel_size=1 convolution acts as a per-time-step Dense producing the 10 outputs.
    source: |-
