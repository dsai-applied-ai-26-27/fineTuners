  - id: s2-1b
    title: 'Question 1 (b)'
    topic: linear
    q: |-
      Explain the manual SGD loop: what learning_schedule is for, and why gradients are computed from a single xi, yi rather than the whole matrix.

      ```python
      n_epochs = 50
      t0, t1 = 5, 50

      def learning_schedule(t):
          return t0 / (t + t1)

      theta = np.random.randn(2, 1)
      for epoch in range(n_epochs):
          for i in range(m):
              random_index = np.random.randint(m)
              xi = X_b[random_index:random_index+1]
              yi = y[random_index:random_index+1]
              gradients = 2 * xi.T.dot(xi.dot(theta) - yi)
              eta = learning_schedule(epoch * m + i)
              theta = theta - eta * gradients
      ```
    solution: |-
      Single instances: each step costs O(1) instead of O(m), so the method scales to very large datasets, and the noise in the updates helps it jump out of local minima. Note there is no /m in the gradient — you are averaging over exactly one instance. The cost is that SGD never settles: with a fixed η it bounces around the optimum forever. learning_schedule(t) = t0/(t+t1) shrinks η as training progresses, so early steps are large (fast progress, still able to escape bad regions) and late steps are tiny (the parameters come to rest). It is simulated annealing; t is the global step count `epoch*m + i`, so the decay is continuous across epochs.
    source: |-
      Labelled "Sample paper 2 · 1b" in the study kit. The wording is the kit's summary of a colleague's practice exam, not the original.

  - id: s2-1c
    title: 'Question 1 (c)'
    topic: evaluation
    q: |-
      Evaluate sgd_clf with cross-validated predictions instead of a single split: cv=3, then print the confusion matrix, precision and recall.
    solution: |-
      ```python
      from sklearn.model_selection import cross_val_predict
      from sklearn.metrics import confusion_matrix, precision_score, recall_score

      y_train_pred = cross_val_predict(sgd_clf, X_train, y_train, cv=3)

      print(confusion_matrix(y_train, y_train_pred))
      print(precision_score(y_train, y_train_pred))
      print(recall_score(y_train, y_train_pred))
      ```

      cross_val_predict, not cross_val_score — you need one out-of-fold prediction per instance to build a confusion matrix, not three fold scores.
