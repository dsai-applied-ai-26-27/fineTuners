  - id: s1-2d
    title: 'Question 2 (d)'
    topic: sequences
    q: |-
      Build a hybrid Conv1D + GRU sequence model: Conv1D with 20 filters, kernel size 4, valid padding, stride 2; two GRU layers of 20 units returning sequences; TimeDistributed Dense(10) output; MSE loss with Adam.
    solution: |-
      ```python
      model = keras.models.Sequential([
          keras.layers.Conv1D(filters=20, kernel_size=4, strides=2, padding="valid",
                              input_shape=[None, 1]),
          keras.layers.GRU(20, return_sequences=True),
          keras.layers.GRU(20, return_sequences=True),
          keras.layers.TimeDistributed(keras.layers.Dense(10))
      ])

      model.compile(loss="mse", optimizer="adam", metrics=[last_time_step_mse])
      history = model.fit(X_train, Y_train[:, 3::2], epochs=20,
                          validation_data=(X_valid, Y_valid[:, 3::2]))
      ```

      Stride 2 halves the output length, so the targets are sliced Y_train[:, 3::2] — start at index 3 (steps lost to valid padding), take every 2nd (the stride).
