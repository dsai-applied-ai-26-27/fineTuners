  - id: s1-2c
    title: 'Question 2 (c)'
    topic: preprocessing
    q: |-
      Tune a DecisionTreeClassifier with GridSearchCV over max_leaf_nodes 2–100 and min_samples_split in {2,3,4}, cv=3, and print the best parameters.
    solution: |-
      ```python
      from sklearn.model_selection import GridSearchCV
      from sklearn.tree import DecisionTreeClassifier

      param_grid = {"max_leaf_nodes": list(range(2, 100)),
                    "min_samples_split": [2, 3, 4]}

      grid_search = GridSearchCV(DecisionTreeClassifier(random_state=42),
                                 param_grid, cv=3)
      grid_search.fit(X_train, y_train)
      print(grid_search.best_params_)
      ```

      grid_search.best_estimator_ is already refitted on the whole training set, so no second fit is needed.
    source: |-
