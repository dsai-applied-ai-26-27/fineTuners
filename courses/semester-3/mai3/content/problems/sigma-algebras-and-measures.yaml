title: σ-algebras and measures
topic: measure
instructions: |-
  The first five problems of last year's measure theory homework (2025-26, homework 2).
  They need only lecture 1. Write a full proof before opening a solution: the sheet said
  that submissions lacking explanations would not be accepted.

  Problems 6 to 9 of that homework use the convergence theorems and are left out until
  those are covered. Last year's sheet writes $A^c$ for the complement where this year's
  notes write $X \setminus A$, and $\subseteq$ where the notes write $\subset$.

questions:
  - id: sam-p1
    title: Finite and co-finite sets
    points: 2
    q: |-
      Let $X$ be an arbitrary infinite set. A subset $A$ of $X$ is said to be *co-finite*
      if its complement $A^c$ is a finite subset of $X$. Let $\mathcal{A}$ consist of all
      finite and co-finite subsets of $X$.
    parts:
      - q: |-
          Is $\mathcal{A}$ an algebra of subsets of $X$? Explain.
        solution: |-
          Yes. An *algebra* is a collection that contains $\varnothing$ and is closed under
          complements and **finite** unions (this term is not defined in this year's
          lecture 1).

          - $\varnothing$ is finite, so $\varnothing \in \mathcal{A}$.
          - If $A$ is finite then $A^c$ is co-finite; if $A$ is co-finite then $A^c$ is
            finite. Either way $A^c \in \mathcal{A}$.
          - Let $A, B \in \mathcal{A}$. If both are finite, $A \cup B$ is finite. Otherwise
            one of them, say $A$, is co-finite, and
            $(A \cup B)^c = A^c \cap B^c \subseteq A^c$ is finite, so $A \cup B$ is
            co-finite.

          **Answer:** yes, $\mathcal{A}$ is an algebra.
      - q: |-
          Show that $\mathcal{A}$ is a σ-algebra if and only if $X$ is a finite set.
        solution: |-
          Here $X$ is allowed to be any set (the claim is that the finite-or-co-finite
          collection is a σ-algebra exactly in the finite case).

          **If $X$ is finite**, every subset is finite, so $\mathcal{A} = \mathcal{P}(X)$,
          which is a σ-algebra.

          **If $X$ is infinite**, choose distinct points $x_1, x_2, x_3, \dots$ in $X$.
          Each singleton $\{x_{2k}\}$ is finite, hence in $\mathcal{A}$. Their countable
          union $E = \{x_2, x_4, x_6, \dots\}$ is infinite, and its complement contains
          $x_1, x_3, x_5, \dots$, so it is infinite too. Thus $E$ is neither finite nor
          co-finite: $E \notin \mathcal{A}$, and $\mathcal{A}$ is not closed under countable
          unions.

          **Answer:** $\mathcal{A}$ is a σ-algebra exactly when $X$ is finite; for the
          infinite $X$ of the problem it is an algebra but not a σ-algebra.
    source: |-
      2025-26 homework 2, problem 1 (Kalabušić, Šabanac). The sheet fixes $X$ infinite and
      then asks for "if and only if $X$ is finite" in part (b); the solution reads (b) as a
      statement about an arbitrary set $X$.

  - id: sam-p2
    title: Half-rays generate the Borel sets
    points: 2
    q: |-
      Show that the Borel σ-algebra $\mathcal{B}(\mathbb{R})$ is generated by the
      collection of half-rays $(a, \infty)$, $a \in \mathbb{R}$.
    steps:
      - do: |-
          Let $\mathcal{E} = \{(a,\infty) : a \in \mathbb{R}\}$. Each $(a,\infty)$ is open,
          so $\mathcal{E} \subseteq \mathcal{B}(\mathbb{R})$ and therefore
          $\sigma(\mathcal{E}) \subseteq \mathcal{B}(\mathbb{R})$.
        why: |-
          $\sigma(\mathcal{E})$ is the smallest σ-algebra containing $\mathcal{E}$, and
          $\mathcal{B}(\mathbb{R})$ is a σ-algebra containing $\mathcal{E}$.
      - do: |-
          $(-\infty, b] = \mathbb{R} \setminus (b,\infty) \in \sigma(\mathcal{E})$.
        why: |-
          Closure under complements.
      - do: |-
          $(a, b] = (a,\infty) \cap (-\infty,b] \in \sigma(\mathcal{E})$.
        why: |-
          Closure under finite intersections.
      - do: |-
          $(a, b) = \bigcup_{n=1}^{\infty} \left( a,\ b - \tfrac1n \right] \in \sigma(\mathcal{E})$.
        why: |-
          Closure under countable unions. Terms with $b - \tfrac1n \le a$ are empty and do
          no harm.
      - do: |-
          Every open subset of $\mathbb{R}$ is a countable union of open intervals, so
          every open set lies in $\sigma(\mathcal{E})$.
        why: |-
          Lecture 1, part 1, p. 6.
      - do: |-
          Hence $\mathcal{B}(\mathbb{R}) \subseteq \sigma(\mathcal{E})$, and with the first
          step $\sigma(\mathcal{E}) = \mathcal{B}(\mathbb{R})$.
        why: |-
          $\mathcal{B}(\mathbb{R})$ is the smallest σ-algebra containing the open sets, and
          $\sigma(\mathcal{E})$ is a σ-algebra containing them.
    answer: |-
      Two inclusions: $\sigma(\mathcal{E}) \subseteq \mathcal{B}(\mathbb{R})$ because rays
      are open, and $\mathcal{B}(\mathbb{R}) \subseteq \sigma(\mathcal{E})$ because every
      open interval, hence every open set, can be built from rays.
    source: |-
      2025-26 homework 2, problem 2. This is item (d) of the generator list in lecture 1.

  - id: sam-p3
    title: Pushing a σ-algebra forward
    points: 2
    q: |-
      Let $f : X_1 \to X_2$ be a function. Let $\mathcal{A}_1$ be a σ-algebra of subsets of
      $X_1$. Put

      $$\mathcal{A}_2 = \{E \subseteq X_2 : f^{-1}(E) \in \mathcal{A}_1\}.$$

      Show that $\mathcal{A}_2$ is a σ-algebra.
    solution: |-
      Inverse images commute with every set operation, so each axiom transfers.

      1. $f^{-1}(\varnothing) = \varnothing \in \mathcal{A}_1$, so
         $\varnothing \in \mathcal{A}_2$.
      2. Let $E \in \mathcal{A}_2$. Then
         $f^{-1}(X_2 \setminus E) = X_1 \setminus f^{-1}(E) \in \mathcal{A}_1$, because
         $f^{-1}(E) \in \mathcal{A}_1$ and $\mathcal{A}_1$ is closed under complements.
         Hence $X_2 \setminus E \in \mathcal{A}_2$.
      3. Let $E_1, E_2, \dots \in \mathcal{A}_2$. Then
         $f^{-1}\big( \bigcup_k E_k \big) = \bigcup_k f^{-1}(E_k) \in \mathcal{A}_1$, a
         countable union of members of $\mathcal{A}_1$. Hence
         $\bigcup_k E_k \in \mathcal{A}_2$.

      **Answer:** $\mathcal{A}_2$ satisfies the three axioms, so it is a σ-algebra on
      $X_2$.

      This is the fact behind the measurability test 2.39: with $X_2 = \mathbb{R}$, the
      sets whose inverse image is measurable form a σ-algebra, so it is enough to check
      them on a generating family.
    source: |-
      2025-26 homework 2, problem 3.

  - id: sam-p4
    title: σ-algebras generated by singletons
    points: 3
    q: |-
      Let $\mathcal{N} = \{\{n\} : n \in \mathbb{Z}\}$ and
      $\mathcal{M} = \{\{r\} : r \in \mathbb{R}\}$. Find the smallest σ-algebra in
      $\mathbb{Z}$ containing $\mathcal{N}$ and the smallest σ-algebra in $\mathbb{R}$
      containing $\mathcal{M}$.
    parts:
      - label: In ℤ
        q: |-
          The smallest σ-algebra in $\mathbb{Z}$ containing $\mathcal{N}$.
        solution: |-
          Every subset $E \subseteq \mathbb{Z}$ is countable, so
          $E = \bigcup_{n \in E} \{n\}$ is a countable union of members of $\mathcal{N}$
          and must belong to any σ-algebra containing $\mathcal{N}$. So the smallest one
          contains every subset.

          **Answer:** $\sigma(\mathcal{N}) = \mathcal{P}(\mathbb{Z})$.
      - label: In ℝ
        q: |-
          The smallest σ-algebra in $\mathbb{R}$ containing $\mathcal{M}$.
        solution: |-
          Let $\mathcal{C}$ be the collection of all $E \subseteq \mathbb{R}$ such that
          $E$ is countable or $\mathbb{R} \setminus E$ is countable.

          **$\mathcal{C}$ is a σ-algebra.** $\varnothing$ is countable. Complements swap
          the two cases. For a sequence $E_1, E_2, \dots$ in $\mathcal{C}$: if every $E_k$
          is countable, so is the union; otherwise some $E_j$ has countable complement, and
          $\mathbb{R} \setminus \bigcup_k E_k \subseteq \mathbb{R} \setminus E_j$ is
          countable.

          **$\mathcal{C}$ contains $\mathcal{M}$**, since singletons are countable.

          **$\mathcal{C}$ is the smallest.** Any σ-algebra $\mathcal{S}$ containing
          $\mathcal{M}$ contains every countable set (a countable union of singletons) and
          the complement of every countable set, so $\mathcal{C} \subseteq \mathcal{S}$.

          **Answer:** $\sigma(\mathcal{M})$ is the σ-algebra of countable or co-countable
          subsets of $\mathbb{R}$. It is strictly smaller than $\mathcal{P}(\mathbb{R})$:
          $(0,\infty)$ is not in it.
    source: |-
      2025-26 homework 2, problem 4. The second part is example 2.28 of lecture 1 with
      $X = \mathbb{R}$.

  - id: sam-p5
    title: Restricting a measure to a set
    points: 2
    q: |-
      Let $(X, \mathcal{M}, \mu)$ be a measure space and let $E \in \mathcal{M}$. Define
      $\gamma_E : \mathcal{A} \to \mathbb{R}^+$ by

      $$\gamma_E(A) = \mu(A \cap E).$$

      Prove that $\gamma_E$ is a measure on $\mathcal{M}$.
    steps:
      - do: |-
          $\gamma_E$ is well defined with values in $[0,\infty]$.
        why: |-
          For $A \in \mathcal{M}$ the set $A \cap E$ is in $\mathcal{M}$ (a σ-algebra is
          closed under finite intersections), so $\mu(A \cap E)$ makes sense.
      - do: |-
          $\gamma_E(\varnothing) = \mu(\varnothing \cap E) = \mu(\varnothing) = 0$.
      - do: |-
          Let $A_1, A_2, \dots \in \mathcal{M}$ be disjoint. Then the sets $A_k \cap E$ are
          disjoint members of $\mathcal{M}$, and
          $\big( \bigcup_k A_k \big) \cap E = \bigcup_k (A_k \cap E)$.
        why: |-
          Subsets of disjoint sets are disjoint; intersection distributes over unions.
      - do: |-
          $\gamma_E\big( \bigcup_k A_k \big) = \mu\big( \bigcup_k (A_k \cap E) \big) = \sum_k \mu(A_k \cap E) = \sum_k \gamma_E(A_k)$.
        why: |-
          Countable additivity of $\mu$ on the disjoint sequence $A_k \cap E$.
    answer: |-
      $\gamma_E(\varnothing) = 0$ and $\gamma_E$ is countably additive, so it is a measure
      on $(X, \mathcal{M})$.
    source: |-
      2025-26 homework 2, problem 5, transcribed as printed. The sheet writes
      $\gamma_E : \mathcal{A} \to \mathbb{R}^+$; the solution reads this as
      $\mathcal{M} \to [0, \infty]$, which is what "a measure on $\mathcal{M}$" requires.
