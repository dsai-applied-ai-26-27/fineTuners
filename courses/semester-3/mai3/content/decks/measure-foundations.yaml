title: σ-algebras, measures and measurable functions
topic: measure
lecture: 01-sigma-algebras-and-measures
description: Definitions, statements and small computations from lecture 1. The proofs are in their own deck.

cards:
  - id: measure-riemann-issues
    q: |-
      Name the three deficiencies of the Riemann integral that motivate measure theory.
    a: |-
      1. It does not handle functions with many discontinuities.
      2. It does not handle unbounded functions.
      3. It does not work well with limits.
    note: |-
      Lecture 1, part 1, p. 1. Each has its own example: the indicator of the rationals
      (1.14), $1/\sqrt{x}$ and its sum over the rationals (1.15, 1.16), and the indicators
      of $\{r_1, \dots, r_k\}$ (1.17).

  - id: measure-dirichlet
    q: |-
      Let $f = 1$ on the rationals and $f = 0$ on the irrationals in $[0,1]$. Show that
      $f$ is not Riemann integrable.
    steps:
      - do: |-
          Take any subinterval $[a,b] \subset [0,1]$ with $a < b$. Then
          $\inf_{[a,b]} f = 0$ and $\sup_{[a,b]} f = 1$.
        why: |-
          Every interval of positive length contains an irrational number and a rational
          number.
      - do: |-
          So $L(f, P, [0,1]) = 0$ and $U(f, P, [0,1]) = 1$ for every partition $P$.
        why: |-
          A lower sum weights each subinterval's infimum by its length, an upper sum its
          supremum, and the lengths add up to $1$.
      - do: |-
          Hence $L(f, [0,1]) = 0 \ne 1 = U(f, [0,1])$, so $f$ is not Riemann integrable.
        why: |-
          Riemann integrable means the lower and upper Riemann integrals agree.
    a: |-
      With Lebesgue measure the "expected" answer $0$ becomes true: the rationals have
      measure $0$.

  - id: measure-limit-failure
    q: |-
      Give a sequence of Riemann integrable functions on $[0,1]$, all bounded by $1$, whose
      pointwise limit is not Riemann integrable.
    a: |-
      List the rationals in $[0,1]$ as $r_1, r_2, \dots$ and let $f_k = 1$ on
      $\{r_1, \dots, r_k\}$ and $0$ elsewhere. Each $\int_0^1 f_k = 0$, but $f_k \to$ the
      indicator of the rationals, which is not Riemann integrable.
    note: |-
      Example 1.17. It is why result 1.18 has to *assume* that the limit is Riemann
      integrable.

  - id: measure-sigma-def
    hy: true
    cloze: |-
      A set $\mathcal{S}$ of subsets of $X$ is a σ-algebra on $X$ if {{$\varnothing \in \mathcal{S}$}};
      if $E \in \mathcal{S}$ then {{$X \setminus E \in \mathcal{S}$}}; and if
      $E_1, E_2, \dots$ is a sequence in $\mathcal{S}$ then {{$\bigcup_{k=1}^{\infty} E_k \in \mathcal{S}$}}.

  - id: measure-sigma-examples
    q: |-
      Name the three standard σ-algebras that exist on every set $X$.
    a: |-
      $\{\varnothing, X\}$, the smallest; $\mathcal{P}(X)$, all subsets, the largest; and
      the sets $E$ such that $E$ or $X \setminus E$ is countable.
    note: |-
      Example 2.24. The third is the σ-algebra generated by the singletons (2.28).

  - id: measure-sigma-finite-check
    q: |-
      On $X = \{1,2,3\}$, which of these is a σ-algebra?

      (i) $\{\varnothing, \{1\}, \{2,3\}, X\}$ (ii) $\{\varnothing, \{1\}, \{2\}, X\}$
    a: |-
      Only (i). In (ii) the complement of $\{1\}$ is $\{2,3\}$, which is missing (so is the
      union $\{1\} \cup \{2\} = \{1,2\}$).
    note: |-
      To refute, one concrete missing set is enough.

  - id: measure-algebra-vs-sigma
    q: |-
      What is an algebra of subsets of $X$, how does it differ from a σ-algebra, and which
      collection is one but not the other?
    a: |-
      An algebra contains $\varnothing$ and is closed under complements and **finite**
      unions; a σ-algebra must be closed under **countable** unions. On an infinite $X$,
      the finite and co-finite sets form an algebra that is not a σ-algebra.
    note: |-
      Last year's homework 2, problem 1. The term is not defined in this year's notes. The
      refutation is [the proof card](card:measure-cofinite-not-sigma).

  - id: measure-cocountable
    q: |-
      Let $\mathcal{S}$ be the subsets of $\mathbf{R}$ that are countable or have a
      countable complement. Is $\mathbf{Q}$ in $\mathcal{S}$? Is $(0, \infty)$?
    a: |-
      $\mathbf{Q} \in \mathcal{S}$ because it is countable. $(0,\infty) \notin \mathcal{S}$:
      it is uncountable and so is its complement $(-\infty, 0]$.

  - id: measure-generated-def
    q: |-
      What is the smallest σ-algebra containing a collection $\mathcal{A}$ of subsets of
      $X$, and why does it exist?
    a: |-
      The intersection of all σ-algebras on $X$ that contain $\mathcal{A}$. The family is
      not empty because $\mathcal{P}(X)$ is one of them, and an intersection of σ-algebras
      is a σ-algebra.
    note: |-
      Result 2.27. Each of the three axioms holds in the intersection because it holds in
      every member of the family.

  - id: measure-generated-compute
    hy: true
    q: |-
      List the smallest σ-algebra on $\mathbf{R}$ containing
      $\mathcal{A} = \{(0,1), (0,\infty)\}$.
    a: |-
      $\varnothing$, $(0,1)$, $[1,\infty)$, $(-\infty,0]$, $(0,\infty)$, $(-\infty,1)$,
      $(-\infty,0] \cup [1,\infty)$, $\mathbf{R}$.
    note: |-
      The generators cut $\mathbf{R}$ into three blocks: $(-\infty,0]$, $(0,1)$,
      $[1,\infty)$. The σ-algebra is all $2^3 = 8$ unions of blocks.
    hook: |-
      Cut into blocks, then count unions: $m$ blocks give $2^m$ sets.

  - id: measure-generated-blocks
    q: |-
      List the smallest σ-algebra on $X = [0,1]$ containing
      $\mathcal{A} = \{(0, \tfrac12), (\tfrac12, 1)\}$. How many sets does it have?
    steps:
      - do: |-
          The blocks: $(0,\tfrac12)$, $(\tfrac12,1)$ and what they leave uncovered,
          $R = \{0, \tfrac12, 1\}$.
        why: |-
          The generators are disjoint; together with the complement of their union they cut
          $X$ into three disjoint non-empty pieces.
      - do: |-
          $\sigma(\mathcal{A})$ is every union of blocks: $2^3 = 8$ sets.
        why: |-
          Each union of blocks must be a member, and the unions of blocks already form a
          σ-algebra.
      - do: |-
          $\varnothing$, $(0,\tfrac12)$, $(\tfrac12,1)$, $\{0,\tfrac12,1\}$,
          $(0,\tfrac12) \cup (\tfrac12,1)$, $[0,\tfrac12] \cup \{1\}$,
          $\{0\} \cup [\tfrac12,1]$, $[0,1]$.
    note: |-
      Left as an exercise in the notes; lecture 1 works it.

  - id: measure-borel-def
    cloze: |-
      The Borel σ-algebra on $\mathbf{R}$ is the {{smallest}} σ-algebra on $\mathbf{R}$
      containing all {{open}} subsets of $\mathbf{R}$.

  - id: measure-borel-generators
    hy: true
    q: |-
      Name three families of intervals, other than the open intervals, each of which
      generates the Borel σ-algebra on $\mathbf{R}$.
    a: |-
      Any three of: closed intervals $[a,b]$; half-open intervals $(a,b]$ or $[a,b)$; open
      rays $(a,\infty)$ or $(-\infty,a)$; closed rays $[a,\infty)$ or $(-\infty,a]$.

  - id: measure-borel-point
    q: |-
      Show that a single point $\{a\}$ and a closed interval $[a,b]$ are Borel sets.
    a: |-
      $\{a\} = \bigcap_{n=1}^{\infty} \left( a - \tfrac1n,\ a + \tfrac1n \right)$, a
      countable intersection of open sets.

      $[a,b] = [a,\infty) \cap (-\infty,b]$, where each closed ray is the complement of an
      open ray.
    note: |-
      Only complements and countable unions or intersections of open sets are used, so the
      result stays inside the σ-algebra generated by the open sets.

  - id: measure-half-open-borel
    q: |-
      Write $[a, b)$ and $(a, b]$ as countable intersections of open intervals.
    a: |-
      $$[a,b) = \bigcap_{n=1}^{\infty} \left( a - \tfrac1n,\ b \right), \qquad (a,b] = \bigcap_{n=1}^{\infty} \left( a,\ b + \tfrac1n \right)$$
    note: |-
      So both are Borel. Alternatively $[a,b) = [a,b] \setminus \{b\}$, by closure under set
      difference.

  - id: measure-borel-q
    q: |-
      Is $\mathbf{Q}$ a Borel set? Is every subset of $\mathbf{R}$ a Borel set?
    a: |-
      $\mathbf{Q}$ is Borel: it is a countable union of single points, each of which is
      Borel. Not every subset of $\mathbf{R}$ is Borel; non-Borel sets exist but are rare.

  - id: measure-def
    hy: true
    cloze: |-
      A measure on $(X, \mathcal{S})$ is a function $\mu : \mathcal{S} \to$ {{$[0, \infty]$}}
      such that {{$\mu(\varnothing) = 0$}} and
      $\mu\big( \bigcup_{k=1}^{\infty} E_k \big) =$ {{$\sum_{k=1}^{\infty} \mu(E_k)$}} for every
      {{disjoint}} sequence $E_1, E_2, \dots$ of sets in $\mathcal{S}$.

  - id: measure-examples
    q: |-
      Define counting measure and the Dirac measure $\delta_c$.
    a: |-
      Counting measure, on all subsets of $X$: $\mu(E)$ is the number of elements of $E$ if
      $E$ is finite, $\infty$ otherwise.

      Dirac measure at $c \in X$: $\delta_c(E) = 1$ if $c \in E$, and $0$ if $c \notin E$.

  - id: measure-examples-compute
    q: |-
      With counting measure $\mu$ on $\mathbf{Z}^+$ and the Dirac measure $\delta_3$ on the
      Borel sets of $\mathbf{R}$, find $\mu(\{2,4,6\})$, $\mu(\{2,4,6,\dots\})$,
      $\delta_3([0,5])$ and $\delta_3(\mathbf{R} \setminus \mathbf{Q})$.
    a: |-
      $3$, $\infty$, $1$, $0$.
    note: |-
      $3 \in [0,5]$, and $3$ is rational, so it is not in $\mathbf{R} \setminus \mathbf{Q}$.

  - id: measure-difference
    q: |-
      For $D \subset E$ in a measure space, state the formula for $\mu(E \setminus D)$ and
      the condition it needs. Why is the condition there?
    a: |-
      $\mu(E \setminus D) = \mu(E) - \mu(D)$, provided $\mu(D) < \infty$.
    note: |-
      It comes from $\mu(E) = \mu(D) + \mu(E \setminus D)$. If $\mu(D) = \infty$, subtracting
      would give $\infty - \infty$.

  - id: measure-limits
    hy: true
    q: |-
      State the measure of an increasing union and of a decreasing intersection. Which one
      needs an extra hypothesis?
    a: |-
      If $E_1 \subset E_2 \subset \cdots$ then
      $\mu\big( \bigcup_k E_k \big) = \lim_{k \to \infty} \mu(E_k)$.

      If $E_1 \supset E_2 \supset \cdots$ **and $\mu(E_1) < \infty$** then
      $\mu\big( \bigcap_k E_k \big) = \lim_{k \to \infty} \mu(E_k)$.
    note: |-
      Results 2.59 and 2.60. Without finiteness the second fails: $E_k = [k, \infty)$ has
      Lebesgue measure $\infty$ for every $k$, but the intersection is empty. (The
      counterexample is standard, not from the notes.)

  - id: measure-union-compute
    q: |-
      In a measure space, $\mu(D) = 5$, $\mu(E) = 4$ and $\mu(D \cap E) = 2$. Find
      $\mu(D \cup E)$ and $\mu(D \setminus E)$.
    a: |-
      $\mu(D \cup E) = 5 + 4 - 2 = 7$ and $\mu(D \setminus E) = 5 - 2 = 3$.
    note: |-
      2.61 for the union; 2.57 for the difference, since
      $D \setminus E = D \setminus (D \cap E)$ and $\mu(D \cap E) < \infty$.

  - id: measure-outer-def
    q: |-
      Define the outer measure $\lvert A \rvert$ of a set $A \subset \mathbf{R}$.
    a: |-
      $$\lvert A \rvert = \inf \Big\{ \sum_{k=1}^{\infty} \ell(I_k) : I_1, I_2, \dots \text{ open intervals with } A \subset \bigcup_{k=1}^{\infty} I_k \Big\}$$
    note: |-
      $\ell(I)$ is the length of the open interval $I$: $b - a$ for $(a,b)$, $0$ for the
      empty set, $\infty$ for rays and the whole line.

  - id: measure-lebesgue-def
    q: |-
      What is Lebesgue measure, and why is outer measure on all subsets of $\mathbf{R}$ not
      used instead?
    a: |-
      Lebesgue measure is the measure on $(\mathbf{R}, \mathcal{B})$ that assigns to each
      Borel set its outer measure. Outer measure is not finitely additive on arbitrary
      subsets of $\mathbf{R}$, so it is not a measure on $\mathcal{P}(\mathbf{R})$;
      restricted to the Borel sets it is (2.68).

  - id: measure-lebesgue-compute
    q: |-
      Give the Lebesgue measure of (a) $[2,5)$, (b) $(1,3) \cup (7,10)$,
      (c) $\mathbf{Q} \cap [0,1]$, (d) the irrationals in $[0,1]$.
    a: |-
      (a) $3$ (b) $2 + 3 = 5$ (c) $0$ (d) $1$
    note: |-
      (a) Endpoints do not change the measure. (b) Finite additivity. (c) Countable set.
      (d) $1 - 0$ by the set-difference rule.

  - id: measure-lebesgue-overlap
    q: |-
      Find the Lebesgue measure of $[0,3) \cup (2,5]$ and of
      $[0,3) \setminus \mathbf{Q}$.
    a: |-
      $3 + 3 - 1 = 5$, and $3$.
    note: |-
      The first by 2.61, since the overlap $(2,3)$ has measure $1 < \infty$. The second by
      2.57: removing the measure-zero set $\mathbf{Q} \cap [0,3)$ changes nothing.

  - id: measure-fn-def
    cloze: |-
      A function $f : X \to \mathbf{R}$ is $\mathcal{S}$-measurable if
      {{$f^{-1}(B) \in \mathcal{S}$}} for every {{Borel}} set $B \subset \mathbf{R}$.

  - id: measure-fn-criterion
    q: |-
      What is the practical test for $\mathcal{S}$-measurability of $f : X \to \mathbf{R}$?
    a: |-
      Check that $f^{-1}\big( (a, \infty) \big) \in \mathcal{S}$ for every $a \in \mathbf{R}$.
    note: |-
      Result 2.39. It works because the rays $(a,\infty)$ generate the Borel sets and the
      sets with measurable inverse image form a σ-algebra.

  - id: measure-fn-trivial
    q: |-
      Which functions $X \to \mathbf{R}$ are $\mathcal{S}$-measurable when
      (a) $\mathcal{S} = \{\varnothing, X\}$, (b) $\mathcal{S} = \mathcal{P}(X)$?
    a: |-
      (a) Only the constant functions. (b) Every function.
    note: |-
      In (a), if $f$ took two values $u \ne v$ then $f^{-1}(\{u\})$ would be neither empty
      nor all of $X$.

  - id: measure-three-point-measurable
    q: |-
      On $X = \{1,2,3\}$ with $\mathcal{S} = \{\varnothing, \{1\}, \{2,3\}, X\}$, which
      functions $f : X \to \mathbf{R}$ are $\mathcal{S}$-measurable?
    a: |-
      Exactly those with $f(2) = f(3)$.
    note: |-
      If $f(2) \ne f(3)$, the inverse image of the Borel set $\{f(2)\}$ contains $2$ but
      not $3$, and no member of $\mathcal{S}$ does. If $f(2) = f(3)$, every inverse image
      is a union of the blocks $\{1\}$ and $\{2,3\}$. A σ-algebra records which points a
      measurable function may tell apart.

  - id: measure-fn-compose
    q: |-
      $f$ is $\mathcal{S}$-measurable. Why are $\lvert f \rvert$ and $f^2$ measurable too?
    a: |-
      Each is $g \circ f$ with $g$ continuous ($g(x) = \lvert x \rvert$, $g(x) = x^2$).
      Continuous functions are Borel measurable, and a Borel measurable function composed
      with a measurable one is measurable, because
      $(g \circ f)^{-1}(B) = f^{-1}\big( g^{-1}(B) \big)$.

  - id: measure-fn-limit
    q: |-
      What happens to measurability under pointwise limits, and why does it matter?
    a: |-
      If $f_1, f_2, \dots$ are $\mathcal{S}$-measurable and $f(x) = \lim_k f_k(x)$ exists
      for every $x$, then $f$ is $\mathcal{S}$-measurable.
    note: |-
      Result 2.48. Riemann integrable functions are not closed under pointwise limits
      (1.17); measurable functions are, which is what a good integration theory needs.

  - id: measure-simple
    q: |-
      Define a simple function, write its standard form, and say when it is measurable.
    a: |-
      A function taking only finitely many values. With distinct non-zero values
      $c_1, \dots, c_n$,

      $$f = c_1 \chi_{E_1} + \dots + c_n \chi_{E_n}, \qquad E_k = f^{-1}(\{c_k\}).$$

      It is $\mathcal{S}$-measurable if and only if $E_1, \dots, E_n \in \mathcal{S}$.

  - id: measure-simple-approx
    q: |-
      State the approximation of a non-negative measurable function by simple functions.
    a: |-
      For measurable $f : A \to [0, \infty)$ there are simple functions $f_n$ with
      $0 \le f_1 \le f_2 \le \dots \le f$ and $f_n(x) \to f(x)$ for every $x \in A$.
