title: 'Proofs: σ-algebras and measures'
topic: measure
lecture: 01-sigma-algebras-and-measures
description: Every proof of lecture 1, and the "prove that" questions of last year's measure theory homework, one step at a time.

cards:
  - id: measure-sigma-basic-ops-proof
    q: |-
      Let $\mathcal{S}$ be a σ-algebra on $X$. Prove that $X \in \mathcal{S}$ and that
      $D \cup E$, $D \cap E$ and $D \setminus E$ are in $\mathcal{S}$ whenever
      $D, E \in \mathcal{S}$.
    steps:
      - do: |-
          $X = X \setminus \varnothing \in \mathcal{S}$.
        why: |-
          $\varnothing \in \mathcal{S}$, and $\mathcal{S}$ is closed under complements.
      - do: |-
          $D \cup E = D \cup E \cup \varnothing \cup \varnothing \cup \cdots \in \mathcal{S}$.
        why: |-
          A finite union is a countable union padded with empty sets.
      - do: |-
          $D \cap E = X \setminus \big( (X \setminus D) \cup (X \setminus E) \big) \in \mathcal{S}$.
        why: |-
          De Morgan's law: complements, a union, then a complement again.
      - do: |-
          $D \setminus E = D \cap (X \setminus E) \in \mathcal{S}$.
        why: |-
          The complement of $E$ is in $\mathcal{S}$, then the previous step.
    note: |-
      Result 2.25, parts 1 and 2. The notes state it without proof; lecture 1 writes the
      argument out under 2.25.

  - id: measure-sigma-intersection
    q: |-
      Prove that a σ-algebra $\mathcal{S}$ on $X$ is closed under countable intersections.
    steps:
      - do: |-
          Let $E_1, E_2, \dots \in \mathcal{S}$. Then each $X \setminus E_k \in \mathcal{S}$.
        why: |-
          Closure under complements.
      - do: |-
          So $\bigcup_{k} (X \setminus E_k) \in \mathcal{S}$.
        why: |-
          Closure under countable unions.
      - do: |-
          $\bigcap_{k} E_k = X \setminus \bigcup_{k} (X \setminus E_k) \in \mathcal{S}$.
        why: |-
          De Morgan's law, then closure under complements once more.
    note: |-
      Result 2.25, part 3. Run backwards, the same law shows that $\varnothing$,
      complements and countable intersections are enough to make a σ-algebra.

  - id: measure-cocountable-sigma-proof
    hy: true
    q: |-
      Prove that the subsets $E \subset X$ such that $E$ is countable or $X \setminus E$ is
      countable form a σ-algebra on $X$.
    steps:
      - do: |-
          $\varnothing$ is countable, so it is in the collection.
      - do: |-
          If $E$ is countable, then $X \setminus E$ has countable complement $E$; if
          $X \setminus E$ is countable, then $X \setminus E$ itself is countable. Either way
          $X \setminus E$ is in the collection.
        why: |-
          Taking a complement swaps the two cases.
      - do: |-
          Let $E_1, E_2, \dots$ be in the collection. If every $E_k$ is countable, so is
          $\bigcup_k E_k$.
        why: |-
          A countable union of countable sets is countable.
      - do: |-
          Otherwise some $X \setminus E_j$ is countable, and
          $X \setminus \bigcup_k E_k \subset X \setminus E_j$ is countable too.
        why: |-
          A bigger union has a smaller complement, and a subset of a countable set is
          countable.
    a: |-
      All three conditions of a σ-algebra hold (2.23).
    note: |-
      Example 2.24, the third standard σ-algebra. It is also the σ-algebra generated by the
      singletons (2.28, last year's homework 2, problem 4:
      [](problems:sigma-algebras-and-measures#sam-p4)).

  - id: measure-cofinite-not-sigma
    q: |-
      Let $X$ be infinite and $\mathcal{A}$ the subsets of $X$ that are finite or have
      finite complement. Prove that $\mathcal{A}$ is not a σ-algebra.
    steps:
      - do: |-
          Choose distinct points $x_1, x_2, x_3, \dots$ in $X$.
        why: |-
          $X$ is infinite.
      - do: |-
          Each singleton $\{x_{2k}\}$ is finite, hence in $\mathcal{A}$.
      - do: |-
          Their countable union $E = \{x_2, x_4, x_6, \dots\}$ is infinite, and
          $X \setminus E$ contains $x_1, x_3, x_5, \dots$, so it is infinite too.
      - do: |-
          So $E \notin \mathcal{A}$: $\mathcal{A}$ is not closed under countable unions.
        why: |-
          To refute a closure property, one concrete sequence is enough.
    a: |-
      $\mathcal{A}$ is an algebra (closed under complements and **finite** unions) but not a
      σ-algebra.
    note: |-
      Last year's homework 2, problem 1
      ([](problems:sigma-algebras-and-measures#sam-p1)). Taking every other point is what
      makes both $E$ and its complement infinite.

  - id: measure-rays-generate-proof
    hy: true
    q: |-
      Prove that the open rays $(a, \infty)$, $a \in \mathbf{R}$, generate the Borel
      σ-algebra $\mathcal{B}$ on $\mathbf{R}$.
    steps:
      - do: |-
          Let $\mathcal{E} = \{(a,\infty) : a \in \mathbf{R}\}$. Each ray is open, so
          $\mathcal{E} \subset \mathcal{B}$, hence $\sigma(\mathcal{E}) \subset \mathcal{B}$.
        why: |-
          $\sigma(\mathcal{E})$ is contained in every σ-algebra that contains $\mathcal{E}$.
      - do: |-
          $(-\infty, b] = \mathbf{R} \setminus (b, \infty) \in \sigma(\mathcal{E})$, so
          $(a, b] = (a, \infty) \cap (-\infty, b] \in \sigma(\mathcal{E})$.
        why: |-
          Complements and finite intersections stay in a σ-algebra.
      - do: |-
          $(a, b) = \bigcup_{n=1}^{\infty} \left( a,\ b - \tfrac1n \right] \in \sigma(\mathcal{E})$.
        why: |-
          A countable union. Terms with $b - \frac1n \le a$ are empty.
      - do: |-
          Every open set is a countable union of open intervals, so every open set is in
          $\sigma(\mathcal{E})$, hence $\mathcal{B} \subset \sigma(\mathcal{E})$.
        why: |-
          $\mathcal{B}$ is the smallest σ-algebra containing the open sets.
    a: |-
      Both inclusions hold, so $\sigma(\mathcal{E}) = \mathcal{B}$.
    note: |-
      Last year's homework 2, problem 2
      ([](problems:sigma-algebras-and-measures#sam-p2)). Every "these sets generate the
      Borel sets" proof has this shape: one easy inclusion, then build the open intervals.

  - id: measure-finite-additivity
    q: |-
      Why does countable additivity imply finite additivity?
    a: |-
      For disjoint $E_1, \dots, E_n$ apply countable additivity to the sequence
      $E_1, \dots, E_n, \varnothing, \varnothing, \dots$ and use $\mu(\varnothing) = 0$.

  - id: measure-cocountable-measure-proof
    q: |-
      On the countable-or-co-countable σ-algebra of $\mathbf{R}$, let $\mu(E) = 0$ if $E$
      is countable and $\mu(E) = 3$ if $E$ is uncountable. Prove that $\mu$ is a measure.
    steps:
      - do: |-
          $\mu(\varnothing) = 0$ because $\varnothing$ is countable.
      - do: |-
          Let $E_1, E_2, \dots$ be disjoint members. At most one of them is uncountable.
        why: |-
          An uncountable member has countable complement. If $E_i$ and $E_j$ both did, the
          complement of $E_i \cap E_j$ would be countable, so $E_i \cap E_j$ would not be
          empty.
      - do: |-
          If all $E_k$ are countable, the union is countable:
          $\mu(\bigcup_k E_k) = 0 = \sum_k \mu(E_k)$.
      - do: |-
          If exactly one $E_j$ is uncountable, the union contains it and is uncountable:
          $\mu(\bigcup_k E_k) = 3 = 3 + 0 + 0 + \cdots = \sum_k \mu(E_k)$.
    a: |-
      $\mu(\varnothing) = 0$ and $\mu$ is countably additive, so it is a measure.
    note: |-
      The third example of 2.55. Not proved in the notes. The heart of it is that two
      co-countable subsets of $\mathbf{R}$ always meet.

  - id: measure-restriction-proof
    hy: true
    q: |-
      Let $(X, \mathcal{S}, \mu)$ be a measure space and $E \in \mathcal{S}$. Prove that
      $\gamma_E(A) = \mu(A \cap E)$ defines a measure on $\mathcal{S}$.
    steps:
      - do: |-
          For $A \in \mathcal{S}$, $A \cap E \in \mathcal{S}$, so $\gamma_E$ is defined on
          $\mathcal{S}$ with values in $[0, \infty]$.
        why: |-
          A σ-algebra is closed under finite intersections (2.25).
      - do: |-
          $\gamma_E(\varnothing) = \mu(\varnothing) = 0$.
      - do: |-
          For disjoint $A_1, A_2, \dots \in \mathcal{S}$ the sets $A_k \cap E$ are disjoint
          and $\big( \bigcup_k A_k \big) \cap E = \bigcup_k (A_k \cap E)$.
        why: |-
          Intersection distributes over unions; subsets of disjoint sets are disjoint.
      - do: |-
          $\gamma_E\big( \bigcup_k A_k \big) = \mu\big( \bigcup_k (A_k \cap E) \big) = \sum_k \mu(A_k \cap E) = \sum_k \gamma_E(A_k)$.
        why: |-
          Countable additivity of $\mu$.
    note: |-
      Last year's homework 2, problem 5
      ([](problems:sigma-algebras-and-measures#sam-p5)).

  - id: measure-monotone-difference-proof
    q: |-
      Let $D \subset E$ be measurable. Prove $\mu(D) \le \mu(E)$, and
      $\mu(E \setminus D) = \mu(E) - \mu(D)$ when $\mu(D) < \infty$.
    steps:
      - do: |-
          $E = D \cup (E \setminus D)$, a disjoint union of measurable sets.
      - do: |-
          $\mu(E) = \mu(D) + \mu(E \setminus D) \ge \mu(D)$.
        why: |-
          Finite additivity, and $\mu(E \setminus D) \ge 0$.
      - do: |-
          If $\mu(D) < \infty$, subtract it from both sides:
          $\mu(E \setminus D) = \mu(E) - \mu(D)$.
        why: |-
          With $\mu(D) = \infty$ the subtraction would be $\infty - \infty$.
    note: |-
      Result 2.57; the proof is the notes'.

  - id: measure-subadditivity-proof
    q: |-
      Prove countable subadditivity: $\mu\big( \bigcup_{k} E_k \big) \le \sum_{k} \mu(E_k)$
      for any measurable $E_1, E_2, \dots$.
    steps:
      - do: |-
          Put $D_1 = E_1$ and $D_k = E_k \setminus (E_1 \cup \dots \cup E_{k-1})$ for
          $k \ge 2$.
        why: |-
          Each $D_k$ keeps only the new points of $E_k$, so the $D_k$ are disjoint and
          measurable.
      - do: |-
          $\bigcup_k D_k = \bigcup_k E_k$ and $D_k \subset E_k$.
        why: |-
          A point of $\bigcup_k E_k$ lies in $D_k$ for the first $k$ with $x \in E_k$.
      - do: |-
          $\mu\big( \bigcup_k E_k \big) = \sum_k \mu(D_k) \le \sum_k \mu(E_k)$.
        why: |-
          Countable additivity on the disjoint $D_k$, then monotonicity (2.57).
    note: |-
      Result 2.58, not proved in the notes; lecture 1 writes the argument out. "Make the
      sets disjoint" is the move to remember.

  - id: measure-increasing-union-proof
    q: |-
      Prove that $\mu\big( \bigcup_k E_k \big) = \lim_{k\to\infty} \mu(E_k)$ for
      measurable $E_1 \subset E_2 \subset \cdots$.
    steps:
      - do: |-
          If some $\mu(E_k) = \infty$, both sides are $\infty$. Assume all are finite and put
          $E_0 = \varnothing$.
        why: |-
          Monotonicity: the union and every later $E_j$ contain $E_k$.
      - do: |-
          The rings $E_j \setminus E_{j-1}$, $j \ge 1$, are disjoint and their union is
          $\bigcup_k E_k$.
      - do: |-
          $\mu\big( \bigcup_k E_k \big) = \sum_{j=1}^{\infty} \mu(E_j \setminus E_{j-1}) = \lim_{k\to\infty} \sum_{j=1}^{k} \big( \mu(E_j) - \mu(E_{j-1}) \big)$.
        why: |-
          Countable additivity; then 2.57 for each ring, allowed because
          $\mu(E_{j-1}) < \infty$.
      - do: |-
          The sum telescopes to $\mu(E_k) - \mu(E_0) = \mu(E_k)$.
    note: |-
      Result 2.59; the proof is the notes'.

  - id: measure-decreasing-intersection-proof
    q: |-
      Prove that $\mu\big( \bigcap_k E_k \big) = \lim_{k\to\infty} \mu(E_k)$ for
      measurable $E_1 \supset E_2 \supset \cdots$ with $\mu(E_1) < \infty$. Where is the
      finiteness used?
    steps:
      - do: |-
          $E_1 \setminus \bigcap_k E_k = \bigcup_k (E_1 \setminus E_k)$, and the sets
          $E_1 \setminus E_k$ increase with $k$.
        why: |-
          De Morgan's law inside $E_1$.
      - do: |-
          $\mu\big( E_1 \setminus \bigcap_k E_k \big) = \lim_k \mu(E_1 \setminus E_k)$.
        why: |-
          The increasing-union rule (2.59).
      - do: |-
          $\mu(E_1) - \mu\big( \bigcap_k E_k \big) = \mu(E_1) - \lim_k \mu(E_k)$.
        why: |-
          2.57 on both sides. **Here** $\mu(E_1) < \infty$ is needed: every set involved lies
          in $E_1$, so no $\infty - \infty$ appears.
      - do: |-
          Cancel the finite number $\mu(E_1)$.
    note: |-
      Result 2.60. Without finiteness it fails: $E_k = [k, \infty)$.

  - id: measure-union-proof
    q: |-
      Prove $\mu(D \cup E) = \mu(D) + \mu(E) - \mu(D \cap E)$ when
      $\mu(D \cap E) < \infty$.
    steps:
      - do: |-
          $D \cup E$ is the disjoint union of $D \setminus (D \cap E)$,
          $E \setminus (D \cap E)$ and $D \cap E$.
      - do: |-
          $\mu(D \cup E) = \big( \mu(D) - \mu(D \cap E) \big) + \big( \mu(E) - \mu(D \cap E) \big) + \mu(D \cap E)$.
        why: |-
          Finite additivity, then 2.57 on the first two pieces, allowed because
          $\mu(D \cap E) < \infty$.
      - do: |-
          Simplify: $\mu(D) + \mu(E) - \mu(D \cap E)$.
    note: |-
      Result 2.61; the proof is the notes'.

  - id: measure-countable-zero
    hy: true
    q: |-
      Prove that every countable subset of $\mathbf{R}$ has outer measure $0$.
    steps:
      - do: |-
          Write $A = \{a_1, a_2, \dots\}$ and fix $\varepsilon > 0$.
        why: |-
          Countable means the points can be listed in a sequence.
      - do: |-
          Let $I_k = \left( a_k - \frac{\varepsilon}{2^k},\ a_k + \frac{\varepsilon}{2^k} \right)$.
        why: |-
          Shrinking the $k$-th interval geometrically keeps the total length finite.
      - do: |-
          $A \subset \bigcup_k I_k$ and
          $\sum_{k=1}^{\infty} \ell(I_k) = \sum_{k=1}^{\infty} \frac{2\varepsilon}{2^k} = 2\varepsilon$,
          so $\lvert A \rvert \le 2\varepsilon$.
        why: |-
          Outer measure is the infimum over all covers, so any one cover bounds it from
          above.
      - do: |-
          $\varepsilon > 0$ was arbitrary, hence $\lvert A \rvert = 0$.
    hook: |-
      Give the $k$-th point an interval of width $\varepsilon$ over $2^k$, twice: the bill
      is $2\varepsilon$.
    note: |-
      Result 2.4; the proof is the notes'.

  - id: measure-pushforward-proof
    hy: true
    q: |-
      Let $f : X_1 \to X_2$ and let $\mathcal{A}_1$ be a σ-algebra on $X_1$. Prove that
      $\mathcal{A}_2 = \{E \subset X_2 : f^{-1}(E) \in \mathcal{A}_1\}$ is a σ-algebra on
      $X_2$.
    steps:
      - do: |-
          $f^{-1}(\varnothing) = \varnothing \in \mathcal{A}_1$, so
          $\varnothing \in \mathcal{A}_2$.
      - do: |-
          If $E \in \mathcal{A}_2$, then
          $f^{-1}(X_2 \setminus E) = X_1 \setminus f^{-1}(E) \in \mathcal{A}_1$, so
          $X_2 \setminus E \in \mathcal{A}_2$.
        why: |-
          Inverse images commute with complements, and $\mathcal{A}_1$ is closed under them.
      - do: |-
          If $E_1, E_2, \dots \in \mathcal{A}_2$, then
          $f^{-1}\big( \bigcup_k E_k \big) = \bigcup_k f^{-1}(E_k) \in \mathcal{A}_1$, so
          $\bigcup_k E_k \in \mathcal{A}_2$.
        why: |-
          Inverse images commute with unions, and $\mathcal{A}_1$ is closed under countable
          unions.
    note: |-
      Last year's homework 2, problem 3
      ([](problems:sigma-algebras-and-measures#sam-p3)). It is the fact behind the
      measurability test 2.39: [the proof of 2.39](card:measure-criterion-proof).

  - id: measure-criterion-proof
    q: |-
      Prove 2.39: if $f^{-1}\big( (a, \infty) \big) \in \mathcal{S}$ for every
      $a \in \mathbf{R}$, then $f : X \to \mathbf{R}$ is $\mathcal{S}$-measurable.
    steps:
      - do: |-
          Let $\mathcal{T} = \{B \subset \mathbf{R} : f^{-1}(B) \in \mathcal{S}\}$. It is a
          σ-algebra on $\mathbf{R}$.
        why: |-
          The push-forward of $\mathcal{S}$ along $f$ ([the push-forward σ-algebra](card:measure-pushforward-proof)).
      - do: |-
          $\mathcal{T}$ contains every ray $(a, \infty)$.
        why: |-
          The hypothesis.
      - do: |-
          So $\mathcal{T}$ contains the σ-algebra the rays generate, which is the Borel
          σ-algebra: $f^{-1}(B) \in \mathcal{S}$ for every Borel $B$.
        why: |-
          The rays generate $\mathcal{B}$ ([rays generate the Borel sets](card:measure-rays-generate-proof)), and a
          generated σ-algebra lies inside every σ-algebra containing the generators.
    note: |-
      The notes state 2.39 without proof and sketch this reason in lecture 1. The pattern,
      "the good sets form a σ-algebra and contain the generators", proves many results.
