name: CI

# Every push to main and every pull request is tested. A push to main that passes is then
# deployed, once deploying has been switched on (deploy/setup-ci.sh does that).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces the older run; runs on main always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # This action publishes exact versions only (there is no moving "v10" tag), so it is
      # pinned to the commit of a release.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      # With Node present, the tests also run every formula of the example course
      # through KaTeX, as `sync_content` does on a laptop.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py check
      - name: Models and migrations agree
        run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py test

  image:
    name: Build and try the production image
    runs-on: ubuntu-latest
    env:
      # Throwaway values for this job only; the server has its own.
      DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-0123456789abcdef
      DJANGO_ALLOWED_HOSTS: vault.test
    steps:
      - uses: actions/checkout@v7
      # The two images the job needs from outside, fetched first and patiently. Runners
      # share their addresses with everyone, and a registry that answers "too many
      # requests" must not turn a run red: on main that would also skip the deploy.
      - name: Fetch the base images
        run: bash .github/scripts/pull-image.sh python:3.13-slim caddy:2-alpine
      # The base image is on the machine now. The build still asks ghcr.io for uv, so it
      # gets a second and third try as well.
      - name: Build the image
        run: |
          for attempt in 1 2 3; do
            docker build --tag dsai-vault:ci . && exit 0
            echo "build failed (attempt $attempt of 3); waiting before the next"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Django's deployment checklist
        run: >
          docker run --rm -e DJANGO_SECRET_KEY -e DJANGO_ALLOWED_HOSTS dsai-vault:ci
          python manage.py check --deploy --fail-level WARNING
      # Started as an open site (DSAI_REQUIRE_LOGIN=0) so that the course pages themselves
      # are fetched, not a redirect to the sign-in.
      - name: Serve the example course from the image
        run: |
          docker run --detach --name web --read-only --tmpfs /tmp \
            -e DJANGO_SECRET_KEY -e DJANGO_ALLOWED_HOSTS -e DSAI_SHOW_EXAMPLE=1 \
            -e DSAI_REQUIRE_LOGIN=0 dsai-vault:ci
          docker exec web python manage.py migrate --noinput
          docker exec web python manage.py sync_content
          for attempt in $(seq 1 15); do
            docker exec web python deploy/smoke.py /courses/example/ /courses/example/cards/least-squares/ && exit 0
            sleep 2
          done
          docker logs web
          exit 1
      # And as the server runs it: the landing page for a visitor, everything else closed.
      - name: With sign-in required, a visitor gets the landing page only
        run: |
          docker run --detach --name closed --read-only --tmpfs /tmp \
            -e DJANGO_SECRET_KEY -e DJANGO_ALLOWED_HOSTS dsai-vault:ci
          docker exec closed python manage.py migrate --noinput
          for attempt in $(seq 1 15); do
            docker exec closed python deploy/smoke.py && break
            sleep 2
          done
          docker exec closed python deploy/smoke.py
          if docker exec closed python deploy/smoke.py /settings/; then
            echo "/settings/ answered a visitor: the sign-in requirement is not working"
            exit 1
          fi
      # Uses the Caddy image fetched in the first step; nothing is downloaded here.
      - name: The proxy configuration is valid
        run: >
          docker run --rm -e ORIGIN_SECRET=ci -e PUBLIC_HOST=vault.test
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          public.ecr.aws/docker/library/caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile

  deploy:
    name: Deploy to the server
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # No third-party action touches the key: it is written to a file and used by ssh.
      # On the server the key is pinned to `deploy ci`, which accepts exactly this request.
      - name: Send this commit to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          git archive --format=tar.gz HEAD |
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
              "$DEPLOY_TARGET" "app $GITHUB_SHA"
