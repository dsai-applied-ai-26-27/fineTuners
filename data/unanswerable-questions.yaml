# Questions the Vault cannot answer, or answers the other way.
# Each question is asked against one course index, not against the whole Vault.
# expected: abstain
#   The notes do not contain the answer. The assistant should say so.
# expected: reject-premise
#   The notes do discuss the topic, and they say the opposite of what the
#   question assumes. Agreeing with the assumption is a wrong answer.
# Absences were checked by searching the course's content files for the terms named in why.
#
# Counts: 10 empty-course, 15 topic-absent, 5 other-course, 2 detail-absent, 9 reject-premise. 41 in total.

